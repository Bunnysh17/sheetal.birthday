<body>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:999999;padding:20px;font-family:monospace;font-size:16px;"><b>ERROR:</b> ' + e.message + '<br>' + e.filename + ':' + e.lineno + '</div>';
    });
  </script>
  <!-- 🕯️ Vintage Aged Journal Background System -->
  <div class="vintage-journal-bg" aria-hidden="true">
    <!-- Warm Candlelight Ambient Glows -->
    <div class="candlelight-glow candle-1"></div>
    <div class="candlelight-glow candle-2"></div>
    <div class="candlelight-glow candle-3"></div>
    <!-- Aged Paper Stains -->
    <div class="vintage-stain stain-1"></div>
    <div class="vintage-stain stain-2"></div>
    <div class="vintage-stain stain-3"></div>
    <!-- Paper Grain Texture -->
    <div class="vintage-paper-grain"></div>
    <!-- Warm Vignette Edges -->
    <div class="vintage-vignette"></div>
  </div>

  <!-- Ambient Background Canvas (Floating Hearts & Stars) -->
  <canvas id="particle-canvas"></canvas>

  <!-- Celebration Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Main Responsive Application Container -->
  <main id="app">
    <div id="page-container" style="width: 100%;">
      <!-- 5 Interactive Screens Rendered Dynamically Here -->
    </div>
  </main>

  <!-- Main JavaScript App (ES Module) -->
  <script type="module" src="js/app.js?v=98.0&circle=edit3"></script>
