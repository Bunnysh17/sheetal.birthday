<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D6336C" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="popperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9FF3"/>
      <stop offset="50%" stop-color="#F368E0"/>
      <stop offset="100%" stop-color="#FF3838"/>
    </linearGradient>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline -->
    <g stroke="#FFFFFF" stroke-width="12" fill="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="50,165 110,135 70,85"/>
      <ellipse cx="90" cy="110" rx="30" ry="14" transform="rotate(-30 90 110)"/>
      <!-- Burst items outline -->
      <circle cx="120" cy="60" r="10"/>
      <circle cx="150" cy="85" r="8"/>
      <circle cx="95" cy="45" r="9"/>
      <circle cx="160" cy="45" r="7"/>
      <polygon points="135,25 140,35 152,36 142,44 145,56 135,49 125,56 128,44 118,36 130,35"/>
    </g>

    <!-- Confetti Streamers & Ribbons -->
    <path d="M100 95 Q135 65 125 35 Q120 20 140 15" stroke="#FF9F43" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M110 110 Q145 95 170 75 Q185 60 175 40" stroke="#00D2D3" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M85 85 Q95 45 75 25" stroke="#54A0FF" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Burst Confetti Shapes -->
    <!-- Golden Star -->
    <polygon points="135,25 138,34 148,35 140,42 143,52 135,46 127,52 130,42 122,35 132,34" fill="#FFD700"/>
    <!-- Cute Pink Heart -->
    <path d="M120 60 C114 54 104 58 104 68 C104 78 120 88 120 88 C120 88 136 78 136 68 C136 58 126 54 120 60 Z" fill="#FF4757" transform="scale(0.7) translate(35, 10)"/>
    <!-- Confetti Dots -->
    <circle cx="155" cy="85" r="5" fill="#5F27CD"/>
    <circle cx="95" cy="45" r="6" fill="#10AC84"/>
    <circle cx="165" cy="45" r="4.5" fill="#FF6B81"/>
    <circle cx="75" cy="65" r="4" fill="#FDCB6E"/>
    <circle cx="145" cy="115" r="5" fill="#48DBFB"/>

    <!-- Party Popper Cone Base -->
    <polygon points="52,162 108,134 72,88" fill="url(#popperGrad)"/>
    
    <!-- Gold / Yellow Stripes on Cone -->
    <polygon points="62,142 74,136 66,120 56,128" fill="#FFEAA7"/>
    <polygon points="78,124 90,118 82,102 72,110" fill="#FFEAA7"/>

    <!-- Cone Rim Oval Opening -->
    <ellipse cx="90" cy="110" rx="26" ry="11" transform="rotate(-32 90 110)" fill="#FFD700"/>
    <ellipse cx="90" cy="110" rx="20" ry="7" transform="rotate(-32 90 110)" fill="#D63031"/>
  </g>
</svg>
