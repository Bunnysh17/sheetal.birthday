<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D6336C" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="bearBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF0DB"/>
      <stop offset="60%" stop-color="#E8C39E"/>
      <stop offset="100%" stop-color="#C69C6D"/>
    </radialGradient>
    <radialGradient id="heartRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="70%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline -->
    <g stroke="#FFFFFF" stroke-width="12" fill="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
      <!-- Ears -->
      <circle cx="65" cy="55" r="20"/>
      <circle cx="135" cy="55" r="20"/>
      <!-- Head -->
      <ellipse cx="100" cy="80" rx="45" ry="38"/>
      <!-- Body -->
      <ellipse cx="100" cy="135" rx="42" ry="44"/>
      <!-- Paws / Arms -->
      <ellipse cx="60" cy="130" rx="18" ry="14" transform="rotate(30 60 130)"/>
      <ellipse cx="140" cy="130" rx="18" ry="14" transform="rotate(-30 140 130)"/>
      <!-- Feet -->
      <ellipse cx="72" cy="172" rx="20" ry="14"/>
      <ellipse cx="128" cy="172" rx="20" ry="14"/>
      <!-- Party Hat Outline -->
      <polygon points="100,10 84,48 116,48"/>
      <circle cx="100" cy="12" r="8"/>
    </g>

    <!-- Body -->
    <ellipse cx="100" cy="135" rx="40" ry="42" fill="url(#bearBody)"/>
    <ellipse cx="100" cy="140" rx="24" ry="26" fill="#FFF5EB"/>

    <!-- Left / Right Ears -->
    <circle cx="65" cy="55" r="18" fill="url(#bearBody)"/>
    <circle cx="65" cy="55" r="10" fill="#FFAAA6"/>
    <circle cx="135" cy="55" r="18" fill="url(#bearBody)"/>
    <circle cx="135" cy="55" r="10" fill="#FFAAA6"/>

    <!-- Head -->
    <ellipse cx="100" cy="80" rx="44" ry="36" fill="url(#bearBody)"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="100" cy="88" rx="18" ry="14" fill="#FFF5EB"/>
    <ellipse cx="100" cy="82" rx="7" ry="5" fill="#4A3B32"/>
    <path d="M100 87 L100 93 M95 93 Q100 97 105 93" stroke="#4A3B32" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Cute Anime Highlights) -->
    <circle cx="82" cy="74" r="5.5" fill="#2D3436"/>
    <circle cx="80.5" cy="72" r="2.2" fill="#FFFFFF"/>
    <circle cx="118" cy="74" r="5.5" fill="#2D3436"/>
    <circle cx="116.5" cy="72" r="2.2" fill="#FFFFFF"/>

    <!-- Blushing Pink Cheeks -->
    <ellipse cx="72" cy="86" rx="7" ry="4.5" fill="#FF8DA1" opacity="0.85"/>
    <ellipse cx="128" cy="86" rx="7" ry="4.5" fill="#FF8DA1" opacity="0.85"/>

    <!-- Tiny Party Hat on Bear -->
    <polygon points="100,16 86,46 114,46" fill="#FF7675"/>
    <path d="M91 36 Q100 40 109 36" stroke="#FFEAA7" stroke-width="3" fill="none"/>
    <circle cx="100" cy="15" r="5.5" fill="#FFD700"/>

    <!-- Red Heart Held in Hands -->
    <path d="M100 116 C88 100 68 112 68 126 C68 142 100 158 100 158 C100 158 132 142 132 126 C132 112 112 100 100 116 Z" fill="url(#heartRed)"/>
    <path d="M78 116 Q72 124 74 132" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Arms / Paws Holding Heart -->
    <ellipse cx="68" cy="130" rx="14" ry="10" transform="rotate(35 68 130)" fill="url(#bearBody)"/>
    <ellipse cx="132" cy="130" rx="14" ry="10" transform="rotate(-35 132 130)" fill="url(#bearBody)"/>

    <!-- Feet Pads -->
    <ellipse cx="74" cy="170" rx="18" ry="12" fill="url(#bearBody)"/>
    <ellipse cx="74" cy="170" rx="11" ry="7" fill="#FFAAA6"/>
    <ellipse cx="126" cy="170" rx="18" ry="12" fill="url(#bearBody)"/>
    <ellipse cx="126" cy="170" rx="11" ry="7" fill="#FFAAA6"/>
  </g>
</svg>
