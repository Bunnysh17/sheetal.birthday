<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="balloonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#E76F51" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#balloonShadow)">
    <!-- White Sticker Outline Base -->
    <path d="M 35 30 C 20 20, 20 40, 35 45 L 30 75 L 45 135 L 60 135 L 50 85 L 90 85 L 85 135 L 100 135 L 105 85 L 125 55 C 135 45, 145 60, 135 70 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Balloon Snout / Nose -->
    <circle cx="28" cy="35" r="7" fill="#FFB703"/>
    <ellipse cx="44" cy="35" rx="14" ry="9" fill="#FFD166"/>
    <circle cx="48" cy="33" r="2.5" fill="#FFFFFF"/>

    <!-- Balloon Ears -->
    <ellipse cx="38" cy="18" rx="8" ry="14" transform="rotate(-15 38 18)" fill="#FFB703"/>
    <ellipse cx="38" cy="18" rx="6" ry="12" transform="rotate(-15 38 18)" fill="#FFD166"/>
    <circle cx="36" cy="14" r="2" fill="#FFFFFF"/>

    <!-- Balloon Neck -->
    <ellipse cx="42" cy="54" rx="7" ry="12" transform="rotate(10 42 54)" fill="#FFB703"/>

    <!-- Balloon Front Legs -->
    <ellipse cx="38" cy="88" rx="8" ry="24" transform="rotate(8 38 88)" fill="#FFD166"/>
    <ellipse cx="52" cy="88" rx="7" ry="22" transform="rotate(-6 52 88)" fill="#FFB703"/>
    <!-- Paws -->
    <circle cx="40" cy="116" r="8" fill="#FFB703"/>
    <circle cx="50" cy="116" r="8" fill="#FFD166"/>

    <!-- Balloon Body -->
    <ellipse cx="78" cy="68" rx="24" ry="12" transform="rotate(5 78 68)" fill="#FFD166"/>
    <!-- Specular highlight on back -->
    <path d="M 64 62 Q 78 58 92 62" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Balloon Back Legs -->
    <ellipse cx="98" cy="88" rx="8" ry="24" transform="rotate(8 98 88)" fill="#FFD166"/>
    <ellipse cx="110" cy="88" rx="7" ry="22" transform="rotate(-6 110 88)" fill="#FFB703"/>
    <circle cx="100" cy="116" r="8" fill="#FFB703"/>
    <circle cx="108" cy="116" r="8" fill="#FFD166"/>

    <!-- Balloon Tail -->
    <ellipse cx="118" cy="50" rx="7" ry="14" transform="rotate(35 118 50)" fill="#FFB703"/>
    <circle cx="130" cy="38" r="8" fill="#FFD166"/>
    <circle cx="128" cy="36" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>
