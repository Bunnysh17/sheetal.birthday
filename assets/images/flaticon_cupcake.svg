<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D6336C" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCAD4"/>
      <stop offset="50%" stop-color="#FF9AA2"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#FFF3CD"/>
      <stop offset="100%" stop-color="#FFEAA7"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4757"/>
      <stop offset="50%" stop-color="#FFA502"/>
      <stop offset="100%" stop-color="#FFEAA7"/>
    </linearGradient>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline -->
    <path d="M50 115 L62 176 C64 184 72 188 100 188 C128 188 136 184 138 176 L150 115 C164 115 168 96 156 86 C164 74 148 62 134 66 C124 50 100 50 90 62 C78 54 60 66 66 84 C52 92 54 115 68 115 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- Candle Outline -->
    <rect x="94" y="24" width="12" height="38" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10"/>
    <ellipse cx="100" cy="18" rx="8" ry="14" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>

    <!-- Cupcake Cup / Wrapper -->
    <path d="M55 118 L66 174 C68 180 76 182 100 182 C124 182 132 180 134 174 L145 118 Z" fill="url(#cupGrad)"/>
    <!-- Wrapper pleats / stripes -->
    <path d="M72 120 L78 178 M88 120 L91 180 M100 120 L100 182 M112 120 L109 180 M128 120 L122 178" stroke="#FDCB6E" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Swirled Strawberry Frosting Base -->
    <ellipse cx="100" cy="116" rx="46" ry="16" fill="#FF758F"/>
    
    <!-- Frosting Layers (Puffy Swirls) -->
    <path d="M56 112 C52 96 68 88 80 92 C88 80 112 80 120 92 C132 88 148 96 144 112 C140 122 60 122 56 112 Z" fill="url(#frostingGrad)"/>
    <path d="M70 94 C68 80 82 72 92 76 C98 68 116 68 122 78 C132 74 138 86 130 96 Z" fill="#FFCAD4"/>
    <ellipse cx="100" cy="74" rx="20" ry="12" fill="#FFE5EC"/>

    <!-- Sprinkles (Cute Hearts and Confetti Dots) -->
    <circle cx="82" cy="104" r="3" fill="#00D2D3"/>
    <circle cx="118" cy="106" r="3" fill="#5F27CD"/>
    <circle cx="92" cy="88" r="3.2" fill="#FF9F43"/>
    <circle cx="110" cy="86" r="3" fill="#10AC84"/>
    <circle cx="128" cy="98" r="2.8" fill="#FFD700"/>
    <circle cx="72" cy="106" r="2.8" fill="#EE5253"/>

    <!-- Birthday Candle -->
    <rect x="96" y="32" width="8" height="30" rx="3" fill="#54A0FF"/>
    <path d="M96 38 L104 42 M96 48 L104 52" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="100" y1="32" x2="100" y2="25" stroke="#222F3E" stroke-width="2"/>

    <!-- Lit Warm Flame -->
    <ellipse cx="100" cy="18" rx="6" ry="10" fill="url(#flameGrad)"/>
    <ellipse cx="100" cy="20" rx="2.5" ry="5" fill="#FFFFFF"/>
  </g>
</svg>
