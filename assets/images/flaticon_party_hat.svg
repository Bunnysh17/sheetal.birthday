<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D6336C" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA"/>
      <stop offset="50%" stop-color="#FFD0D0"/>
      <stop offset="100%" stop-color="#FFAAA6"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </linearGradient>
  </defs>
  
  <g filter="url(#stickerShadow)">
    <!-- White Die-Cut Sticker Outline -->
    <path d="M100 18 L160 148 C160 162 140 172 100 172 C60 172 40 162 40 148 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="100" cy="22" r="18" fill="#FFFFFF"/>
    
    <!-- Hat Cone Base -->
    <path d="M100 28 L152 144 C140 156 120 162 100 162 C80 162 60 156 48 144 Z" fill="url(#hatGrad)"/>
    
    <!-- Decorative Stripes -->
    <path d="M72 74 Q100 88 128 74 L138 96 Q100 110 62 96 Z" fill="#FFE5EC" opacity="0.9"/>
    <path d="M54 116 Q100 132 146 116 L150 134 Q100 150 50 134 Z" fill="#FFE5EC" opacity="0.9"/>
    
    <!-- Polka Dots / Golden Stars -->
    <circle cx="85" cy="55" r="4" fill="#FFD700"/>
    <circle cx="115" cy="55" r="4" fill="#FFD700"/>
    <circle cx="100" cy="115" r="5" fill="#FFD700"/>
    <circle cx="75" cy="140" r="4" fill="#FF6B8B"/>
    <circle cx="125" cy="140" r="4" fill="#FF6B8B"/>
    
    <!-- Bottom Rim Fluff -->
    <ellipse cx="100" cy="148" rx="54" ry="12" fill="url(#rimGrad)"/>
    
    <!-- Fluffy Pom-Pom on Top -->
    <circle cx="100" cy="24" r="14" fill="#FFD700"/>
    <circle cx="95" cy="20" r="4" fill="#FFF9E6"/>
    <circle cx="106" cy="26" r="3" fill="#F39C12"/>
  </g>
</svg>
