<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8EC"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sg2)"/>
  <circle cx="200" cy="120" r="70" fill="#FFFDF9"/>
  <!-- Two walking feet / shoe prints / starry path -->
  <g transform="translate(165, 80)">
    <ellipse cx="25" cy="40" rx="14" ry="8" fill="#F4A261" transform="rotate(-15 25 40)"/>
    <ellipse cx="45" cy="30" rx="14" ry="8" fill="#E76F51" transform="rotate(15 45 30)"/>
    <ellipse cx="30" cy="65" rx="14" ry="8" fill="#F4A261" transform="rotate(-15 30 65)"/>
    <ellipse cx="50" cy="55" rx="14" ry="8" fill="#E76F51" transform="rotate(15 50 55)"/>
  </g>
  <text x="200" y="225" font-family="'Gaegu', cursive" font-size="22" font-weight="bold" fill="#4A3E3D" text-anchor="middle">Long Evening Walks 🌅👣</text>
  <text x="200" y="250" font-family="'Nunito', sans-serif" font-size="12" fill="#885A5A" text-anchor="middle">Customizable in config.js</text>
</svg>
