<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <defs>
    <filter id="bowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#D6336C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bowShadow)">
    <!-- White Sticker Outline -->
    <path d="M 80 50 C 60 15, 10 20, 15 65 C 20 100, 65 80, 80 65 C 95 80, 140 100, 145 65 C 150 20, 100 15, 80 50 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 70 65 L 45 125 L 70 115 L 80 132 L 90 115 L 115 125 L 90 65 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>

    <!-- Left Ribbon Wing -->
    <path d="M 80 55 C 60 25, 20 28, 22 62 C 24 90, 65 72, 80 60 Z" fill="#FF758F"/>
    <path d="M 28 42 C 45 35, 68 45, 76 54" stroke="#FF4D6D" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 32 75 C 48 70, 68 64, 76 60" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Right Ribbon Wing -->
    <path d="M 80 55 C 100 25, 140 28, 138 62 C 136 90, 95 72, 80 60 Z" fill="#FF758F"/>
    <path d="M 132 42 C 115 35, 92 45, 84 54" stroke="#FF4D6D" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 128 75 C 112 70, 92 64, 84 60" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Left Hanging Ribbon Tail -->
    <polygon points="72,60 48,120 68,110 78,126 80,68" fill="#FF8FAB"/>
    <path d="M 68 65 L 56 115" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Hanging Ribbon Tail -->
    <polygon points="88,60 112,120 92,110 82,126 80,68" fill="#FF8FAB"/>
    <path d="M 92 65 L 104 115" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center Bow Knot -->
    <rect x="68" y="46" width="24" height="24" rx="8" fill="#FF4D6D" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="80" cy="58" r="4" fill="#FF8FAB"/>
  </g>
</svg>
