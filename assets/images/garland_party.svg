<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%" fill="none">
  <!-- Draped Garland Strings -->
  <path d="M 10 20 Q 150 75 300 35 Q 450 75 590 20" stroke="#FF8FA3" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <path d="M 30 45 Q 160 100 300 60 Q 440 100 570 45" stroke="#FFAAA6" stroke-width="2.5" fill="none"/>

  <!-- Top Flags Upper String -->
  <!-- Flag 1 Pink -->
  <polygon points="50,32 80,38 65,75" fill="#FF758F" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 2 Yellow -->
  <polygon points="100,43 130,48 115,85" fill="#FFD166" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 3 Mint/Cyan -->
  <polygon points="150,51 180,53 165,92" fill="#06D6A0" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 4 Lavender -->
  <polygon points="200,52 230,50 215,90" fill="#B388EB" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 5 Coral -->
  <polygon points="250,47 280,42 265,82" fill="#FF8FAB" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 6 Yellow (Center) -->
  <polygon points="310,40 340,46 325,84" fill="#FFD166" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 7 Peach -->
  <polygon points="360,50 390,53 375,91" fill="#FF9F1C" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 8 Blue -->
  <polygon points="410,53 440,51 425,92" fill="#4CC9F0" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 9 Pink -->
  <polygon points="460,48 490,43 475,85" fill="#FF4D6D" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Flag 10 Mint -->
  <polygon points="510,38 540,32 525,75" fill="#06D6A0" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Lower String Flags -->
  <!-- Flag L1 -->
  <polygon points="80,62 110,70 95,102" fill="#FFB703" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Flag L2 -->
  <polygon points="140,79 170,84 155,115" fill="#FF758F" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Flag L3 -->
  <polygon points="200,85 230,83 215,116" fill="#7209B7" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Flag L4 -->
  <polygon points="360,83 390,85 375,116" fill="#4CC9F0" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Flag L5 -->
  <polygon points="420,84 450,79 435,115" fill="#FFD166" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Flag L6 -->
  <polygon points="480,70 510,62 495,102" fill="#FF758F" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Little Hanging Golden Stars -->
  <g transform="translate(65,75) scale(0.6)"><path d="M0 -8 L2.5 -2.5 L8 0 L2.5 2.5 L0 8 L-2.5 2.5 L-8 0 L-2.5 -2.5 Z" fill="#FFE600" stroke="#FFFFFF" stroke-width="1.5"/></g>
  <g transform="translate(165,92) scale(0.7)"><path d="M0 -8 L2.5 -2.5 L8 0 L2.5 2.5 L0 8 L-2.5 2.5 L-8 0 L-2.5 -2.5 Z" fill="#FFE600" stroke="#FFFFFF" stroke-width="1.5"/></g>
  <g transform="translate(265,82) scale(0.6)"><path d="M0 -8 L2.5 -2.5 L8 0 L2.5 2.5 L0 8 L-2.5 2.5 L-8 0 L-2.5 -2.5 Z" fill="#FFE600" stroke="#FFFFFF" stroke-width="1.5"/></g>
  <g transform="translate(325,84) scale(0.7)"><path d="M0 -8 L2.5 -2.5 L8 0 L2.5 2.5 L0 8 L-2.5 2.5 L-8 0 L-2.5 -2.5 Z" fill="#FFE600" stroke="#FFFFFF" stroke-width="1.5"/></g>
  <g transform="translate(425,92) scale(0.6)"><path d="M0 -8 L2.5 -2.5 L8 0 L2.5 2.5 L0 8 L-2.5 2.5 L-8 0 L-2.5 -2.5 Z" fill="#FFE600" stroke="#FFFFFF" stroke-width="1.5"/></g>
  <g transform="translate(525,75) scale(0.6)"><path d="M0 -8 L2.5 -2.5 L8 0 L2.5 2.5 L0 8 L-2.5 2.5 L-8 0 L-2.5 -2.5 Z" fill="#FFE600" stroke="#FFFFFF" stroke-width="1.5"/></g>
