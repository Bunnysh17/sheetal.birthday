<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- White Sticker Drop Shadow -->
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D6336C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Contour Background -->
    <path d="M 22 55 L 45 20 L 60 42 L 100 42 L 115 20 L 138 55 L 148 65 L 138 148 L 22 148 L 12 65 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Open Box Lid Wings -->
    <polygon points="18,65 52,48 55,75 22,82" fill="#4361EE"/>
    <polygon points="142,65 108,48 105,75 138,82" fill="#4361EE"/>

    <!-- Black Cat Head -->
    <ellipse cx="80" cy="55" rx="35" ry="30" fill="#2B2D42"/>
    <!-- Cat Ears -->
    <polygon points="50,42 45,18 64,32" fill="#2B2D42"/>
    <polygon points="110,42 115,18 96,32" fill="#2B2D42"/>
    <polygon points="52,38 48,24 61,32" fill="#FF8FAB"/>
    <polygon points="108,38 112,24 99,32" fill="#FF8FAB"/>

    <!-- Cat Big Cute Eyes -->
    <ellipse cx="68" cy="52" rx="9" ry="11" fill="#FFD166"/>
    <ellipse cx="92" cy="52" rx="9" ry="11" fill="#FFD166"/>
    <ellipse cx="69" cy="52" rx="5" ry="8" fill="#1D3557"/>
    <ellipse cx="91" cy="52" rx="5" ry="8" fill="#1D3557"/>
    <circle cx="67" cy="48" r="2.5" fill="#FFFFFF"/>
    <circle cx="89" cy="48" r="2.5" fill="#FFFFFF"/>

    <!-- Cat Cute Nose & Blush -->
    <polygon points="80,60 77,58 83,58" fill="#FF758F"/>
    <circle cx="58" cy="62" r="5" fill="#FFB4D6" opacity="0.6"/>
    <circle cx="102" cy="62" r="5" fill="#FFB4D6" opacity="0.6"/>

    <!-- Cat Paws resting on box edge -->
    <ellipse cx="60" cy="74" rx="9" ry="6" fill="#2B2D42"/>
    <ellipse cx="100" cy="74" rx="9" ry="6" fill="#2B2D42"/>
    <circle cx="56" cy="75" r="1.5" fill="#FFFFFF"/>
    <circle cx="60" cy="76" r="1.5" fill="#FFFFFF"/>
    <circle cx="64" cy="75" r="1.5" fill="#FFFFFF"/>
    <circle cx="96" cy="75" r="1.5" fill="#FFFFFF"/>
    <circle cx="100" cy="76" r="1.5" fill="#FFFFFF"/>
    <circle cx="104" cy="75" r="1.5" fill="#FFFFFF"/>

    <!-- Gift Box Body -->
    <rect x="25" y="72" width="110" height="70" rx="6" fill="#3A0CA3"/>
    
    <!-- Stars & Sparkles on Gift Box -->
    <path d="M 80 82 L 83 95 L 96 98 L 83 101 L 80 114 L 77 101 L 64 98 L 77 95 Z" fill="#FF758F"/>
    <path d="M 45 105 L 47 113 L 55 115 L 47 117 L 45 125 L 43 117 L 35 115 L 43 113 Z" fill="#FFD166"/>
    <path d="M 115 105 L 117 113 L 125 115 L 117 117 L 115 125 L 113 117 L 105 115 L 113 113 Z" fill="#4CC9F0"/>
    <circle cx="60" cy="90" r="3" fill="#FFD166"/>
    <circle cx="100" cy="90" r="3" fill="#06D6A0"/>
  </g>
</svg>
