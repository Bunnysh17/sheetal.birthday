<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC"/>
      <stop offset="50%" stop-color="#FFC2D1"/>
      <stop offset="100%" stop-color="#FFB3C6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE5EC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="260" r="180" fill="url(#sunGlow)"/>
  
  <!-- Romantic Aesthetic Silhouette / Illustration -->
  <g transform="translate(150, 100)">
    <!-- Decorative Frame -->
    <ellipse cx="150" cy="180" rx="140" ry="160" fill="#FFFDF9" stroke="#FF8FA3" stroke-width="6" stroke-dasharray="12 8"/>
    <!-- Aesthetic Flowers / Sparkles -->
    <circle cx="150" cy="150" r="70" fill="#FF85A1" opacity="0.25"/>
    <text x="150" y="150" font-family="'Gaegu', cursive, sans-serif" font-size="64" text-anchor="middle" fill="#E75480">✨ 🌸 ✨</text>
    <text x="150" y="210" font-family="'Gaegu', cursive, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#4A3E3D">My Favorite Person</text>
    <text x="150" y="245" font-family="'Nunito', sans-serif" font-size="16" text-anchor="middle" fill="#885A5A">Replace with your photo in config.js</text>
  </g>
  <!-- Floating Hearts -->
  <path d="M100 120 C100 100 80 100 80 120 C80 140 100 155 100 155 C100 155 120 140 120 120 C120 100 100 100 100 120 Z" fill="#FF4D6D" opacity="0.75"/>
  <path d="M500 140 C500 120 480 120 480 140 C480 160 500 175 500 175 C500 175 520 160 520 140 C520 120 500 120 500 140 Z" fill="#FF758F" opacity="0.8"/>
  <path d="M480 480 C480 460 460 460 460 480 C460 500 480 515 480 515 C480 515 500 500 500 480 C500 460 480 460 480 480 Z" fill="#FF4D6D" opacity="0.7"/>
  <path d="M120 480 C120 460 100 460 100 480 C100 500 120 515 120 515 C120 515 140 500 140 480 C140 460 120 460 120 480 Z" fill="#FF85A1" opacity="0.75"/>
</svg>
